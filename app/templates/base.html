<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} - Encrypted file store</title>
</head>
<body>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
    <p class="flash flash-{{ category }}" role="status">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
